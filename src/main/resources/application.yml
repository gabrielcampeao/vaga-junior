spring:
  application:
    name: posto

  datasource:
    # AUTO_SERVER=TRUE permite que a aplicação e outro cliente (ex: visualizador de BD da IDE)
    # acessem o arquivo ./data/posto simultaneamente sem erro de lock.
    url: jdbc:h2:file:./data/posto;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    # NOTA: Usuario 'sa' sem senha deve ser usado apenas para desenvolvimento
    username: sa
    password:

  jpa:
    hibernate:
      # MELHORIA FUTURA: Trocar 'ddl-auto: update' por controle de migracoes como o Flyway
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      # NOTA: H2 Console habilitado apenas para facilitar o desenvolvimento local
      enabled: true
      path: /h2-console

posto:
  abastecimento:
    limite-litros: "200.000"

server:
  port: 8080
